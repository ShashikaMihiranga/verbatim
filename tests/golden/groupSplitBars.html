<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>
body{margin:0}
.v{--bg:#f2f7f6;--surface:#ffffff;--ink:#12303a;--muted:#546b71;--line:#d3e0df;--accent:#0f6688;--on-accent:#ffffff;

<body><div class="v" style="width:1180px;min-height:440px;max-width:100%;margin:0 auto;position:relative"><div style="padding:56px 48px"><div style="font-size:20px;font-weight:600;line-height:1.3">Two groups side by side</div><div style="font-size:14px;color:var(--muted);margin-top:2px">18-24 (n=5,100) against 25-34 (n=9,800). Share of each group&#x27;s own answers.</div><div style="height:24px"></div><div style="margin-top:4px;display:flex;gap:20px;font-size:14px;color:var(--muted)"><span style="display:inline-flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:3px;background:var(--ink)"></span>18-24</span><span style="display:inline-flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:3px;background:color-mix(in srgb,var(--ink) 35%,var(--surface))"></span>25-34</span></div><div style="margin-top:12px"><div style="display:flex;align-items:center;gap:16px;height:64px;border-top:1px solid var(--line)"><div style="flex:0 0 clamp(140px,20%,240px);font-size:15px;font-weight:500;line-height:1.2">Cost</div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:16px;border-radius:3px;background:var(--line);overflow:hidden"><div style="width:40%;height:100%;background:var(--t1)"></div></div><div style="width:48px;text-align:right;font-size:14px;font-weight:600">40%</div></div><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:16px;border-radius:3px;background:var(--line);overflow:hidden"><div style="width:38%;height:100%;background:color-mix(in srgb,var(--t1) 45%,var(--surface))"></div></div><div style="width:48px;text-align:right;font-size:14px;font-weight:600;color:var(--muted)">38%</div></div></div></div><div style="display:flex;align-items:center;gap:16px;height:64px;border-top:1px solid var(--line)"><div style="flex:0 0 clamp(140px,20%,240px);font-size:15px;font-weight:500;line-height:1.2">Charging</div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:16px;border-radius:3px;background:var(--line);overflow:hidden"><div style="width:30%;height:100%;background:var(--t2)"></div></div><div style="width:48px;text-align:right;font-size:14px;font-weight:600">30%</div></div><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:16px;border-radius:3px;background:var(--line);overflow:hidden"><div style="width:32%;height:100%;background:color-mix(in srgb,var(--t2) 45%,var(--surface))"></div></div><div style="width:48px;text-align:right;font-size:14px;font-weight:600;color:var(--muted)">32%</div></div></div></div><div style="display:flex;align-items:center;gap:16px;height:64px;border-top:1px solid var(--line)"><div style="flex:0 0 clamp(140px,20%,240px);font-size:15px;font-weight:500;line-height:1.2">Range and battery</div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:16px;border-radius:3px;background:var(--line);overflow:hidden"><div style="width:13%;height:100%;background:var(--t3)"></div></div><div style="width:48px;text-align:right;font-size:14px;font-weight:600">13%</div></div><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:16px;border-radius:3px;background:var(--line);overflow:hidden"><div style="width:14%;height:100%;background:color-mix(in srgb,var(--t3) 45%,var(--surface))"></div></div><div style="width:48px;text-align:right;font-size:14px;font-weight:600;color:var(--muted)">14%</div></div></div></div><div style="display:flex;align-items:center;gap:16px;height:64px;border-top:1px solid var(--line)"><div style="flex:0 0 clamp(140px,20%,240px);font-size:15px;font-weight:500;line-height:1.2">Not needed</div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:16px;border-radius:3px;background:var(--line);overflow:hidden"><div style="width:4%;height:100%;background:var(--t4)"></div></div><div style="width:48px;text-align:right;font-size:14px;font-weight:600">4%</div></div><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:16px;border-radius:3px;background:var(--line);overflow:hidden"><div style="width:5%;height:100%;background:color-mix(in srgb,var(--t4) 45%,var(--surface))"></div></div><div style="width:48px;text-align:right;font-size:14px;font-weight:600;color:var(--muted)">5%</div></div></div></div><div style="display:flex;align-items:center;gap:16px;height:64px;border-top:1px solid var(--line)"><div style="flex:0 0 clamp(140px,20%,240px);font-size:15px;font-weight:500;line-height:1.2">Doubts about the technology</div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:16px;border-radius:3px;background:var(--line);overflow:hidden"><div style="width:6%;height:100%;background:var(--t5)"></div></div><div style="width:48px;text-align:right;font-size:14px;font-weight:600">6%</div></div><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:16px;border-radius:3px;background:var(--line);overflow:hidden"><div style="width:7%;height:100%;background:color-mix(in srgb,var(--t5) 45%,var(--surface))"></div></div><div style="width:48px;text-align:right;font-size:14px;font-weight:600;color:var(--muted)">7%</div></div></div></div></div></div></div></body></html>
