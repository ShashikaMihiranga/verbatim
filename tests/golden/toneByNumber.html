<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[toneByNumber]</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
.v{--bg:#f2f7f6;--surface:#ffffff;--ink:#12303a;--muted:#546b71;--line:#d3e0df;--accent:#0f6688;--on-accent:#ffffff;
--t1:#3f8a57;--t2:#2680c7;--t3:#26cbd8;--t4:#43b895;--t5:#0f6688;--t6:#a5c94a;--t7:#1eaae4;--other:#8b9a9f;
--neg:#c8503f;--neu:#b3bfc1;--pos:#3f8a57;--on-neg:#ffffff;--on-neu:#12303a;--on-pos:#ffffff;
--ramp:#2680c7;--on-ramp:#ffffff;--dim:.28;
font-family:'Jost',sans-serif;font-size:16px;line-height:1.55;font-weight:400;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);box-sizing:border-box}
.v.dark{--bg:#0c191e;--surface:#12262d;--ink:#e3efee;--muted:#9fb5b8;--line:#25434b;--accent:#5cc8e6;--on-accent:#0c191e;
--neg:#e2705f;--neu:#5b767c;--pos:#5fb37a;--on-neg:#0c191e;--on-neu:#e3efee;--on-pos:#0c191e;--ramp:#5cc8e6;--on-ramp:#0c191e}
.v *{box-sizing:border-box}
.v svg{display:block;overflow:visible}
.v svg text{font-family:'Jost',sans-serif;font-variant-numeric:tabular-nums}
html,body{background:#f2f7f6}</style></head>
<body><div class="v" style="width:1180px;min-height:300px;max-width:100%;margin:0 auto;position:relative"><div style="padding:56px 48px"><div style="font-size:20px;font-weight:600;line-height:1.3">Tone by number band</div><div style="font-size:14px;color:var(--muted);margin-top:2px">Likelihood to buy, lowest to highest. Average sentiment per band, dashed line is 0 (neutral).</div><div style="height:24px"></div><div style="display:flex;align-items:center;gap:16px;height:60px;border-top:1px solid var(--line)"><div style="flex:0 0 clamp(140px,20%,220px);font-size:15px;font-weight:500">Low (0-6)</div><div style="position:relative;width:760px;height:28px"><div style="position:absolute;left:50%;top:0;bottom:0;width:0;border-left:1px dashed var(--muted)"></div><div style="position:absolute;top:50%;transform:translateY(-50%);left:43.0%;width:7.0%;height:16px;border-radius:3px;background:color-mix(in srgb,var(--neg) 53%,var(--neu))"></div></div><div style="width:64px;text-align:right;font-size:14px;font-weight:600">-0.14</div><div style="width:72px;text-align:right;font-size:13px;color:var(--muted)">16,000</div></div><div style="display:flex;align-items:center;gap:16px;height:60px;border-top:1px solid var(--line)"><div style="flex:0 0 clamp(140px,20%,220px);font-size:15px;font-weight:500">Middle (7-8)</div><div style="position:relative;width:760px;height:28px"><div style="position:absolute;left:50%;top:0;bottom:0;width:0;border-left:1px dashed var(--muted)"></div><div style="position:absolute;top:50%;transform:translateY(-50%);left:45.0%;width:5.0%;height:16px;border-radius:3px;background:var(--neu)"></div></div><div style="width:64px;text-align:right;font-size:14px;font-weight:600">-0.10</div><div style="width:72px;text-align:right;font-size:13px;color:var(--muted)">19,000</div></div><div style="display:flex;align-items:center;gap:16px;height:60px;border-top:1px solid var(--line)"><div style="flex:0 0 clamp(140px,20%,220px);font-size:15px;font-weight:500">High (9-10)</div><div style="position:relative;width:760px;height:28px"><div style="position:absolute;left:50%;top:0;bottom:0;width:0;border-left:1px dashed var(--muted)"></div><div style="position:absolute;top:50%;transform:translateY(-50%);left:48.5%;width:1.5%;height:16px;border-radius:3px;background:color-mix(in srgb,var(--pos) 76%,var(--neu))"></div></div><div style="width:64px;text-align:right;font-size:14px;font-weight:600">-0.03</div><div style="width:72px;text-align:right;font-size:13px;color:var(--muted)">12,525</div></div></div></div></body></html>
